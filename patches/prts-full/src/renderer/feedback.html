<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRTS · 意见反馈</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1d2733;
        --fg-dim: #5a6a7a;
        --bg: #e9edf2;
        --card: #ffffffb8;
        --line: #c6cfd9;
        --accent: #2e7d5b;
        --accent-fg: #ffffff;
        --danger: #b3473e;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #d7e3ec;
          --fg-dim: #8aa0b2;
          --bg: #11151a;
          --card: #1a212b99;
          --line: #2c3944;
          --accent: #3fa97c;
          --accent-fg: #0c1310;
          --danger: #e07b72;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px 18px 14px;
        font: 13px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        color: var(--fg);
        background: var(--bg);
        user-select: none;
      }
      h1 { font-size: 15px; margin: 0 0 2px; }
      p.note { margin: 0 0 12px; color: var(--fg-dim); font-size: 12px; }
      .types { display: flex; gap: 8px; margin-bottom: 12px; }
      .type-card {
        flex: 1;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        padding: 10px 12px;
        cursor: pointer;
        transition: border-color 120ms ease, background 120ms ease;
      }
      .type-card.selected { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 14%, transparent); }
      .type-card .t-title { font-weight: 600; }
      .type-card .t-desc { font-size: 11px; color: var(--fg-dim); margin-top: 2px; }
      label.field-label { display: block; font-weight: 600; margin: 8px 0 4px; }
      input[type="text"], textarea {
        width: 100%;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--fg);
        font: inherit;
        outline: none;
      }
      textarea { resize: vertical; min-height: 110px; }
      input:focus, textarea:focus { border-color: var(--accent); }
      .row { display: flex; gap: 8px; align-items: center; }
      button {
        padding: 7px 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
      button:disabled { opacity: 0.55; cursor: default; }
      #status {
        margin-top: 10px;
        font-size: 12px;
        min-height: 1.4em;
        color: var(--fg-dim);
        user-select: text;
        overflow-wrap: anywhere;
      }
      #status.ok { color: var(--accent); }
      #status.err { color: var(--danger); }
      #deviceBox {
        margin-top: 8px;
        padding: 10px 12px;
        border: 1px dashed var(--line);
        border-radius: 8px;
        font-size: 12px;
        display: none;
      }
      #deviceBox .code { font-family: ui-monospace, Consolas, monospace; font-size: 16px; font-weight: 700; letter-spacing: 2px; }
      a { color: var(--accent); }
    </style>
  </head>
  <body>
    <h1>意见反馈</h1>
    <p class="note">提交后将作为 GitHub Issue 发到项目仓库（首次提交需授权一次 GitHub）。</p>

    <div class="types" id="types">
      <div class="type-card selected" data-type="feature">
        <div class="t-title">✨ 希望功能</div>
        <div class="t-desc">新的功能 / 改进建议</div>
      </div>
      <div class="type-card" data-type="bug">
        <div class="t-title">🐛 Debug（Bug 报告）</div>
        <div class="t-desc">异常 / 崩溃 / 不符合预期</div>
      </div>
    </div>

    <label class="field-label" for="title">标题</label>
    <input type="text" id="title" placeholder="一句话描述" spellcheck="false" />

    <label class="field-label" for="body">详细描述</label>
    <textarea id="body" placeholder="功能：使用场景、期望行为、价值…&#10;Bug：复现步骤、期望、实际表现…" spellcheck="false"></textarea>

    <div id="deviceBox">
      <div>请在浏览器打开 <a id="deviceUri" href="#" target="_blank">授权页面</a> 并输入代码：</div>
      <div class="code" id="deviceCode"></div>
    </div>

    <div class="row" style="margin-top:12px">
      <button type="button" id="submitBtn" class="primary">提交到 GitHub</button>
      <div id="status"></div>
    </div>

    <script src="./feedback.js"></script>
  </body>
</html>
