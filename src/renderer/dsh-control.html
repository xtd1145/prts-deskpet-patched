<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PRTS · DSH 控制台</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1d2733;
        --fg-dim: #5a6a7a;
        --bg: #e9edf2;
        --card: #ffffffb8;
        --line: #c6cfd9;
        --accent: #2e7d5b;
        --accent-fg: #ffffff;
        --danger: #b3473e;
        --ok: #2e7d5b;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #d7e3ec;
          --fg-dim: #8aa0b2;
          --bg: #11151a;
          --card: #1a212b99;
          --line: #2c3944;
          --accent: #3fa97c;
          --accent-fg: #0c1310;
          --danger: #e07b72;
          --ok: #3fa97c;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 16px 18px 14px;
        font: 13px/1.55 -apple-system, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
        color: var(--fg);
        background: var(--bg);
        user-select: none;
      }
      h1 { font-size: 15px; margin: 0 0 2px; }
      p.note { margin: 0 0 12px; color: var(--fg-dim); font-size: 12px; }
      .card {
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        padding: 10px 12px;
        margin-bottom: 12px;
      }
      .status-line {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        margin-bottom: 8px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        flex: none;
        background: var(--fg-dim);
      }
      .dot.on { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
      .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
      .toggle-row {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
      }
      button {
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--fg);
        font: inherit;
        cursor: pointer;
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
        font-weight: 600;
      }
      button.danger {
        border-color: var(--danger);
        color: var(--danger);
      }
      button:disabled { opacity: 0.55; cursor: default; }
      select, input[type="text"] {
        width: 100%;
        padding: 7px 9px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        color: var(--fg);
        font: inherit;
        outline: none;
      }
      select:focus, input:focus { border-color: var(--accent); }
      label.field-label {
        display: block;
        font-weight: 600;
        margin: 8px 0 4px;
      }
      #sessions {
        max-height: 168px;
        overflow-y: auto;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        margin-bottom: 4px;
      }
      .session-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 9px;
        cursor: pointer;
        border-bottom: 1px solid var(--line);
      }
      .session-row:last-child { border-bottom: none; }
      .session-row.selected { background: color-mix(in srgb, var(--accent) 18%, transparent); }
      .session-row .sdot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--fg-dim); }
      .session-row .sdot.on { background: var(--ok); }
      .session-row .sid { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--fg-dim); }
      .session-row .smeta { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
      .empty-hint { padding: 10px; color: var(--fg-dim); font-size: 12px; text-align: center; }
      #status {
        margin-top: 10px;
        font-size: 12px;
        min-height: 1.4em;
        color: var(--fg-dim);
        user-select: text;
      }
      #status.ok { color: var(--ok); }
      #status.err { color: var(--danger); }
      .actions { display: flex; gap: 8px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>DSH 控制台 · DeepSeek Harness</h1>
    <p class="note" data-i18n="note">
      管理 127.0.0.1:3080 的 DeepSeek Harness 服务：启动/停止、查看会话、直接给 agent 发消息或打断。
    </p>

    <div class="card">
      <div class="status-line">
        <span class="dot" id="statusDot"></span>
        <span id="statusText" data-i18n="probing">正在检测服务…</span>
      </div>
      <div class="row">
        <button type="button" id="startBtn" data-i18n="start">启动服务</button>
        <button type="button" id="stopBtn" class="danger" data-i18n="stop">停止服务</button>
        <button type="button" id="openBtn" data-i18n="openPanel">打开面板</button>
        <button type="button" id="refreshBtn" data-i18n="refresh">刷新</button>
      </div>
      <div class="toggle-row" style="margin-top:10px">
        <input type="checkbox" id="autoStart" />
        <label for="autoStart" data-i18n="autoStart">随 PRTS 启动 DSH 服务</label>
      </div>
    </div>

    <div class="card">
      <label class="field-label" data-i18n="sessionsLabel">会话列表（点击选择发送目标）</label>
      <div id="sessions">
        <div class="empty-hint" id="sessionsHint" data-i18n="noSessions">（暂无会话 / 服务未运行）</div>
      </div>
      <label class="field-label" for="msg" data-i18n="msgLabel">消息</label>
      <input type="text" id="msg" placeholder="向选中的 agent 发送消息…" spellcheck="false" />
      <div class="actions">
        <button type="button" id="sendBtn" class="primary" data-i18n="send">发送 (queue)</button>
        <button type="button" id="steerBtn" data-i18n="steer">打断并重定向 (steer)</button>
        <button type="button" id="cancelBtn" class="danger" data-i18n="cancel">停止当前回合</button>
      </div>
      <div id="status"></div>
    </div>

    <script src="./dsh-control.js"></script>
  </body>
</html>
